# Separate stack for the team's external development database.
# Never combine with docker-compose.yml: that file owns the old local database.
name: ielts-shared-dev

services:
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Explicitly run migrations after inspecting the target database.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.dev}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: [/bin/sh, -ec]
    command: ['exec migrate -path=/migrations -database="$$DATABASE_URL" up']
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.dev
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60s}
      LISTENING_MEDIA_DIR: /data/listening-media
      SPEAKING_MEDIA_DIR: /data/speaking-media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - listening_media:/data/listening-media
      - speaking_media:/data/speaking-media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
  listening_media:
  speaking_media:
