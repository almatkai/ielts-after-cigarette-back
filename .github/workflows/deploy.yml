name: Test, build, and deploy

# Pushes to dev run tests only (no dev build/deploy: a single, production
# environment is deployed on the server). Pushes to main additionally build
# the production image and deploy it. Because both jobs live in one
# branch-aware file, merging dev into main never removes the production
# pipeline again.
#
# The build job intentionally does not wait for tests: it only produces an
# image tagged with the commit SHA, so a red test run can never move a shared
# tag. Deploy gates on both jobs.

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.ref_name }}
  # Superseded dev pushes are worthless; a main run may be mid-deploy.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The regression tests in internal/testdb skip themselves without
      # TEST_DATABASE_URL. Without this service they never run in CI.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ielts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ielts_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ielts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # vet is not cached by Go and used to cost more than the race suite
      # itself, so both run at the same time.
      - name: Test and vet
        run: |
          go vet ./... & vet_pid=$!
          go test -race ./...
          wait "$vet_pid"

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Compiling on the runner reuses the Go build cache that setup-go
      # restores; compiling inside the image always starts from scratch
      # because COPY . . invalidates the layer on every commit.
      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o dist/ ./cmd/api ./cmd/admin ./cmd/worker
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '9865' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      BACKEND_IMAGE: ${{ needs.build.outputs.image }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
      ACCESS_TOKEN_TTL: ${{ vars.ACCESS_TOKEN_TTL }}
      REFRESH_TOKEN_TTL: ${{ vars.REFRESH_TOKEN_TTL }}
      REFRESH_COOKIE_NAME: ${{ vars.REFRESH_COOKIE_NAME }}
      REFRESH_COOKIE_SECURE: ${{ vars.REFRESH_COOKIE_SECURE }}
      REFRESH_COOKIE_SAME_SITE: ${{ vars.REFRESH_COOKIE_SAME_SITE }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GUEST_TRIAL_ENABLED: ${{ vars.GUEST_TRIAL_ENABLED || 'false' }}
      GUEST_TRIAL_IP_LIMIT: ${{ vars.GUEST_TRIAL_IP_LIMIT || '5' }}
      GUEST_TRIAL_GLOBAL_LIMIT: ${{ vars.GUEST_TRIAL_GLOBAL_LIMIT || '100' }}
      GUEST_TRIAL_EXAM_TYPES: ${{ vars.GUEST_TRIAL_EXAM_TYPES || 'academic' }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_HOSTNAMES: ${{ vars.TURNSTILE_HOSTNAMES }}
      SHUTDOWN_TIMEOUT: ${{ vars.SHUTDOWN_TIMEOUT }}
      REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT }}
      MEDIA_UPLOAD_TIMEOUT: ${{ vars.MEDIA_UPLOAD_TIMEOUT || '5m' }}
      MAX_MEDIA_UPLOAD_BYTES: ${{ vars.MAX_MEDIA_UPLOAD_BYTES || '52428800' }}
      MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES }}
      STT_API_KEY: ${{ secrets.STT_API_KEY }}
      STT_API_URL: ${{ vars.STT_API_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_PROVIDER_ENCRYPTION_KEY: ${{ secrets.AI_PROVIDER_ENCRYPTION_KEY }}
      AI_CHAT_COMPLETIONS_URL: ${{ vars.AI_CHAT_COMPLETIONS_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_SPEAKING_MODEL: ${{ vars.AI_SPEAKING_MODEL }}
      AI_SPEAKING_AUDIO_ENABLED: ${{ vars.AI_SPEAKING_AUDIO_ENABLED }}
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT }}
      AUTH_RATE_LIMIT: ${{ vars.AUTH_RATE_LIMIT }}
      AUTH_RATE_WINDOW: ${{ vars.AUTH_RATE_WINDOW }}
      PHONE_VERIFICATION_SECRET: ${{ secrets.PHONE_VERIFICATION_SECRET }}
      PHONE_CODE_TTL: ${{ vars.PHONE_CODE_TTL }}
      PHONE_TOKEN_TTL: ${{ vars.PHONE_TOKEN_TTL }}
      PHONE_RESEND_INTERVAL: ${{ vars.PHONE_RESEND_INTERVAL }}
      PHONE_MAX_ATTEMPTS: ${{ vars.PHONE_MAX_ATTEMPTS }}
      INFOBIP_BASE_URL: ${{ vars.INFOBIP_BASE_URL }}
      INFOBIP_ENABLED: ${{ vars.INFOBIP_ENABLED }}
      INFOBIP_API_KEY: ${{ secrets.INFOBIP_API_KEY }}
      INFOBIP_WHATSAPP_SENDER: ${{ secrets.INFOBIP_WHATSAPP_SENDER }}
      INFOBIP_WHATSAPP_TEMPLATE: ${{ vars.INFOBIP_WHATSAPP_TEMPLATE }}
      INFOBIP_WHATSAPP_LANGUAGE: ${{ vars.INFOBIP_WHATSAPP_LANGUAGE }}
      INFOBIP_TIMEOUT: ${{ vars.INFOBIP_TIMEOUT }}
      SUPER_ADMIN_EMAILS: ${{ vars.SUPER_ADMIN_EMAILS }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
      SENTRY_RELEASE: ${{ vars.SENTRY_RELEASE }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/ielts_deploy
          chmod 600 ~/.ssh/ielts_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk -v host="$DEPLOY_HOST" -v port="$DEPLOY_PORT" '/^#/ || /^$/ || /^\[/ { print; next } { $1 = "[" host "]:" port; print }' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare production configuration
        run: |
          : "${AI_PROVIDER_ENCRYPTION_KEY:?Set the AI_PROVIDER_ENCRYPTION_KEY GitHub Actions secret}"
          umask 077
          {
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'BACKEND_PORT=%s\n' "$BACKEND_PORT"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_ISSUER=%s\n' "$JWT_ISSUER"
            printf 'JWT_AUDIENCE=%s\n' "$JWT_AUDIENCE"
            printf 'ACCESS_TOKEN_TTL=%s\n' "$ACCESS_TOKEN_TTL"
            printf 'REFRESH_TOKEN_TTL=%s\n' "$REFRESH_TOKEN_TTL"
            printf 'REFRESH_COOKIE_NAME=%s\n' "$REFRESH_COOKIE_NAME"
            printf 'REFRESH_COOKIE_SECURE=%s\n' "$REFRESH_COOKIE_SECURE"
            printf 'REFRESH_COOKIE_SAME_SITE=%s\n' "$REFRESH_COOKIE_SAME_SITE"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GUEST_TRIAL_ENABLED=%s\n' "$GUEST_TRIAL_ENABLED"
            printf 'GUEST_TRIAL_IP_LIMIT=%s\n' "$GUEST_TRIAL_IP_LIMIT"
            printf 'GUEST_TRIAL_GLOBAL_LIMIT=%s\n' "$GUEST_TRIAL_GLOBAL_LIMIT"
            printf 'GUEST_TRIAL_EXAM_TYPES=%s\n' "$GUEST_TRIAL_EXAM_TYPES"
            printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
            printf 'TURNSTILE_HOSTNAMES=%s\n' "$TURNSTILE_HOSTNAMES"
            printf 'SHUTDOWN_TIMEOUT=%s\n' "$SHUTDOWN_TIMEOUT"
            printf 'REQUEST_TIMEOUT=%s\n' "$REQUEST_TIMEOUT"
            printf 'MEDIA_UPLOAD_TIMEOUT=%s\n' "$MEDIA_UPLOAD_TIMEOUT"
            printf 'MAX_MEDIA_UPLOAD_BYTES=%s\n' "$MAX_MEDIA_UPLOAD_BYTES"
            printf 'MAX_REQUEST_BODY_BYTES=%s\n' "$MAX_REQUEST_BODY_BYTES"
            printf 'STT_API_KEY=%s\n' "$STT_API_KEY"
            printf 'STT_API_URL=%s\n' "$STT_API_URL"
            printf 'AI_API_KEY=%s\n' "$AI_API_KEY"
            printf 'AI_PROVIDER_ENCRYPTION_KEY=%s\n' "$AI_PROVIDER_ENCRYPTION_KEY"
            printf 'AI_CHAT_COMPLETIONS_URL=%s\n' "$AI_CHAT_COMPLETIONS_URL"
            printf 'AI_MODEL=%s\n' "$AI_MODEL"
            printf 'AI_SPEAKING_MODEL=%s\n' "$AI_SPEAKING_MODEL"
            printf 'AI_SPEAKING_AUDIO_ENABLED=%s\n' "$AI_SPEAKING_AUDIO_ENABLED"
            printf 'AI_TIMEOUT=%s\n' "$AI_TIMEOUT"
            printf 'AUTH_RATE_LIMIT=%s\n' "$AUTH_RATE_LIMIT"
            printf 'AUTH_RATE_WINDOW=%s\n' "$AUTH_RATE_WINDOW"
            printf 'PHONE_VERIFICATION_SECRET=%s\n' "$PHONE_VERIFICATION_SECRET"
            printf 'PHONE_CODE_TTL=%s\n' "$PHONE_CODE_TTL"
            printf 'PHONE_TOKEN_TTL=%s\n' "$PHONE_TOKEN_TTL"
            printf 'PHONE_RESEND_INTERVAL=%s\n' "$PHONE_RESEND_INTERVAL"
            printf 'PHONE_MAX_ATTEMPTS=%s\n' "$PHONE_MAX_ATTEMPTS"
            printf 'INFOBIP_BASE_URL=%s\n' "$INFOBIP_BASE_URL"
            printf 'INFOBIP_ENABLED=%s\n' "$INFOBIP_ENABLED"
            printf 'INFOBIP_API_KEY=%s\n' "$INFOBIP_API_KEY"
            printf 'INFOBIP_WHATSAPP_SENDER=%s\n' "$INFOBIP_WHATSAPP_SENDER"
            printf 'INFOBIP_WHATSAPP_TEMPLATE=%s\n' "$INFOBIP_WHATSAPP_TEMPLATE"
            printf 'INFOBIP_WHATSAPP_LANGUAGE=%s\n' "$INFOBIP_WHATSAPP_LANGUAGE"
            printf 'INFOBIP_TIMEOUT=%s\n' "$INFOBIP_TIMEOUT"
            printf 'SUPER_ADMIN_EMAILS=%s\n' "$SUPER_ADMIN_EMAILS"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'SENTRY_ENVIRONMENT=%s\n' "$SENTRY_ENVIRONMENT"
            printf 'SENTRY_RELEASE=%s\n' "$SENTRY_RELEASE"
          } > production.env
      # One SSH connection for every file: previous versions opened three
      # (install -d, scp, deploy) which cost more than the payload transfer.
      - name: Upload deployment files
        run: |
          tar -czf - docker-compose.production.yml docker-compose.observability.yml docker-compose.pgstats.yml docker-compose.server.yml ops migrations scripts/deploy-production.sh production.env \
            | ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
                'install -d -m 700 ~/ielts-api && tar -xzf - -C ~/ielts-api'
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_deploy "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 ~/ielts-api/.docker && DOCKER_CONFIG=~/ielts-api/.docker docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/ielts-api && bash scripts/deploy-production.sh' </dev/null
