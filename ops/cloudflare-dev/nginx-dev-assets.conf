# Include inside the isolated dev server block. Mount static-assets read-only at
# /srv/retained-static/app/assets in the dev gateway container.
location ^~ /app/assets/ {
    root /srv/retained-static;
    try_files $uri @web_assets;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location @web_assets {
    proxy_pass http://web:3000;
    proxy_set_header Host ielts.woolet.cc;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
}
