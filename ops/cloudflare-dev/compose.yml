name: ielts-guest-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ielts_dev
      POSTGRES_DB: ielts_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ielts_dev -d ielts_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?}']
    volumes: [redis_data:/data]
    mem_limit: 128m
    restart: unless-stopped
  minio:
    image: iac-minio:2025-09-07
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:19010:9000']
    mem_limit: 384m
    restart: unless-stopped
  backend:
    image: iac-backend:guest-dev-20261007
    env_file: app.env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
  worker:
    image: iac-backend:guest-dev-20261007
    entrypoint: [/app/worker]
    env_file: app.env
    environment: {DB_MAX_CONNS: '5'}
    depends_on: [backend]
    mem_limit: 384m
    restart: unless-stopped
  web:
    image: iac-web:guest-dev-20261007
    environment: {HOST: 0.0.0.0, NODE_ENV: production, PORT: '3000'}
    mem_limit: 256m
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:18097:80']
    depends_on: [backend, web]
    mem_limit: 64m
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    network_mode: host
    command: [tunnel, --no-autoupdate, --protocol, http2, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    mem_limit: 128m
    restart: unless-stopped

secrets:
  tunnel_token: {file: ./tunnel-token}
volumes:
  postgres_data:
  redis_data:
  minio_data:
