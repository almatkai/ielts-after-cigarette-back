name: ielts-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-local-redis-password}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/${POSTGRES_DB:-ielts}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/${POSTGRES_DB:-ielts}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456}
      PHONE_VERIFICATION_SECRET: ${PHONE_VERIFICATION_SECRET:-local-phone-verification-change-me-123456}
      JWT_ISSUER: ${JWT_ISSUER:-ielts-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ielts-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ielts_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60s}
      MEDIA_UPLOAD_TIMEOUT: ${MEDIA_UPLOAD_TIMEOUT:-5m}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      LISTENING_MEDIA_DIR: /data/listening-media

      SPEAKING_MEDIA_DIR: /data/speaking-media
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-minio}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-local-minio-admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-minio-password}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ielts-media}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-false}
      MAX_MEDIA_UPLOAD_BYTES: ${MAX_MEDIA_UPLOAD_BYTES:-52428800}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
      PHONE_CODE_TTL: ${PHONE_CODE_TTL:-5m}
      PHONE_TOKEN_TTL: ${PHONE_TOKEN_TTL:-10m}
      PHONE_RESEND_INTERVAL: ${PHONE_RESEND_INTERVAL:-1m}
      PHONE_MAX_ATTEMPTS: ${PHONE_MAX_ATTEMPTS:-5}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-https://l2vz85.api.infobip.com}
      INFOBIP_ENABLED: ${INFOBIP_ENABLED:-false}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_WHATSAPP_SENDER: ${INFOBIP_WHATSAPP_SENDER:-}
      INFOBIP_WHATSAPP_TEMPLATE: ${INFOBIP_WHATSAPP_TEMPLATE:-}
      INFOBIP_WHATSAPP_LANGUAGE: ${INFOBIP_WHATSAPP_LANGUAGE:-en}
      INFOBIP_TIMEOUT: ${INFOBIP_TIMEOUT:-10s}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-https://openrouter.ai/api/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-openrouter/free}
      AI_SPEAKING_MODEL: ${AI_SPEAKING_MODEL:-thinkingmachines/inkling-small:free}
      AI_SPEAKING_AUDIO_ENABLED: ${AI_SPEAKING_AUDIO_ENABLED:-true}
      AI_TIMEOUT: ${AI_TIMEOUT:-45s}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_SPEAKING_MODEL: ${OPENROUTER_SPEAKING_MODEL:-thinkingmachines/inkling-small:free}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-45s}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - listening_media:/data/listening-media
      - speaking_media:/data/speaking-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  listening_media:
  speaking_media:
  minio_data:
